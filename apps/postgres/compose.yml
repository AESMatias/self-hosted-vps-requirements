# name: PostgreSQL
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports: ["127.0.0.1:5432:5432"] # localhost only: do not publish a database to the internet
    environment:
      POSTGRES_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    volumes: [data:/var/lib/postgresql/data]
volumes:
  data:
