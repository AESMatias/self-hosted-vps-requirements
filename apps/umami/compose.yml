# name: Umami
services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://umami:changeme@db:5432/umami # internal network only
      APP_SECRET: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: changeme
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      retries: 30
volumes:
  db:
