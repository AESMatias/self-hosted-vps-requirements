# name: Ghost
services:
  ghost:
    image: ghost:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports: ["2368:2368"]
    environment:
      url: http://localhost:2368 # set to your public URL
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: changeme # internal network only, the db port is not published
      database__connection__database: ghost
    volumes: [content:/var/lib/ghost/content]
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: changeme
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -pchangeme --silent"]
      interval: 5s
      retries: 30
volumes:
  content:
  db:
